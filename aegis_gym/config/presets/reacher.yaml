# PPO configuration for the reacher environment.
rl:
  class_name: "OnPolicyRunner" # Number of steps per environment per iteration
  num_steps_per_env: 24  # Number of policy updates
  max_iterations: 500
  seed: 1
  use_cameras: False
  # Observations mapping
  obs_groups: {"actor": ["policy"], "critic": ["policy"]}

  # Logging parameters
  save_interval: 100  # Check for potential saves every `save_interval` iterations
  best_model_skip_iters: 100  # Ignore first N iterations when tracking best model
  experiment_name: null
  run_name: ""
  algorithm:
    class_name: "PPO"
    # Training
    learning_rate: 0.0003
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: "adaptive"  # adaptive, fixed
    # Value function
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: True
    # Surrogate loss
    desired_kl: 0.01
    entropy_coef: 0.0
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0
    # Miscellaneous
    normalize_advantage_per_mini_batch: False
    # Random network distilation
    rnd_cfg: null
    # Symmetry augmentation
    symmetry_cfg: null
  init_member_classes: {}
  policy:
    actor:
      class_name: "MLPModel"
      hidden_dims: [128, 128, 64]
      activation: "elu"  # original: "relu"
      obs_normalization: False
      distribution_cfg:
        class_name: "GaussianDistribution"  # state-dependent std: HeteroscedasticGaussianDistribution
        init_std: 1.0
        std_type: "scalar"  # 'scalar' or 'log'
    critic:
      class_name: "MLPModel"
      hidden_dims: [128, 128, 64]
      activation: "elu"
      obs_normalization: False
    # Reinitialize the last layer every `interval` iterations: `actor`, `critic` or `both`.
    # An interval of 0 disables it.
    reset_last_layer_weights: {"interval": 0, "part": "both"}
    # Stop the gradient at the actor inputs, so the actor does not shape their representation.
    detach_actor_grad: False
logger:
  # Policy preview video at the end of the training, `--no-record` disables it
  enable_policy_preview: True

dr:
  enabled: True
  image_aug:
    enabled: True
    per_episode_aug: True
    brightness_jitter: 0.4
    contrast_jitter: 0.3
    gaussian_noise_std: 0.025
    gamma_range: 0.25
    channel_jitter: 0.05
    blur_prob: 0.30
    blur_kernel_size: 3
    blur_sigma: 0.8
    cutout:
      prob: 0.3
      min_size: 4
      max_size: 12
  pd_gains:
    enabled: True
    kp_noise: 0.10
    kv_noise: 0.10
  max_speed:
    enabled: True
    linear_speed_noise: 0.03
    angular_speed_noise: 0.03
  cameras_extrinsics:
    enabled: True
    scene_cam:
      translation_std: 0.0
      rotation_std_deg: 1.0
    tool_cams:
      translation_std: 0.001
      rotation_std_deg: 0.6
