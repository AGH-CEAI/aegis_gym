# PPO configuration for the push_t environment, based on the ManiSkill3 PushT-v1
# and IsaacLab rsl_rl manipulation baselines.
rl:
  class_name: "OnPolicyRunner" # Number of steps per environment per iteration
  num_steps_per_env: 48  # Number of policy updates
  max_iterations: 3000
  seed: 1
  use_cameras: False
  # Observations mapping
  obs_groups: {"policy": ["policy"], "critic": ["policy"]}

  # Logging parameters
  save_interval: 100  # Check for potential saves every `save_interval` iterations
  best_model_skip_iters: 100  # Ignore first N iterations when tracking best model
  experiment_name: null
  run_name: ""
  algorithm:
    class_name: "PPO"
    # Training
    learning_rate: 0.0003
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: "adaptive"  # adaptive, fixed
    # Value function
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: True
    # Surrogate loss
    desired_kl: 0.01
    entropy_coef: 0.005
    gamma: 0.995  # ~200 steps (8 s at 25 Hz) horizon, the task takes 10-30 s
    lam: 0.95
    max_grad_norm: 1.0
    # Miscellaneous
    normalize_advantage_per_mini_batch: False
    # Random network distilation
    rnd_cfg: null
    # Symmetry augmentation
    symmetry_cfg: null
  # reset_last_layer_weights_interval: 0 # Set above 0 to enable
  # reset_last_layer_weights_part: part # `actor`, `critic` or `both`
  reset_last_layer_weights: {"interval": 0, "part": "both"}
  init_member_classes: {}
  policy:
    class_name: "ActorCritic"
    activation: "elu"  # original: "relu"
    actor_obs_normalization: True
    critic_obs_normalization: True
    init_noise_std: 1.0
    actor_hidden_dims: [256, 256, 128]
    critic_hidden_dims: [256, 256, 128]
    noise_std_type: "log"  # 'scalar' or 'log'
    state_dependent_std: False
    detach_actor_grad: False

bc:
  # The grasp studies' optimizer settings (lr, steps, grad clip) are kept for the comparability
  num_steps_per_env: 24
  learning_rate: 0.001
  # The samples of a 32k buffer (64 envs) in ~2k batches: 48 updates per iteration, as in the
  # grasp studies (5 x 10), but with fewer passes over the rarely refreshed samples
  num_epochs: 3
  num_mini_batches: 16
  # Push-T episodes are long (teacher ~9 s, timeout 30 s): the student-driven rollouts alone
  # rarely reach the late, fine alignment phase, so the teacher takes over the large deviations
  use_teacher_mixing: True
  # Steps per env, the float32 RGB buffer of 3 cameras at 64x64 takes ~4.7 GB with 64 envs
  buffer_size: 500
  policy:
    encoder_type: "shared_cnn"
    # Keeps the image patches positions, which the tee pose precision relies on (the linear
    # fusion averages each camera down to a 4x4 grid); the lowest action loss in the grasp studies
    fusion_type: "attention_spatial"
    # The tee pose as the auxiliary target, the main latent of the task
    use_pose_head: True
    action_head_state_obs_dim: 7  # TCP pose
    # The teacher's capacity: the Push-T actions depend on the contact geometry
    action_head_hidden_dims: [256, 256, 128]
    pose_head_hidden_dims: [64, 64]

logger:
  # Policy preview video at the end of the training, `--no-record` disables it
  enable_policy_preview: True
