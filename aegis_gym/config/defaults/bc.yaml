# basic training parameters
num_steps_per_env: 24
learning_rate: 0.001
num_epochs: 5
num_mini_batches: 10
max_grad_norm: 1.0
save_recons: False
save_recon_freq: 100
use_teacher_mixing: False
# train on the teacher actions clipped to the env's [-1, 1] (what the env executes)
clip_teacher_actions: False
# float32 or uint8 (the [0, 1] images in 1/255 steps, a quarter of the memory)
image_buffer_dtype: "float32"
use_cameras: True
# algorithm parameters
# TODO(issue#111) simplify config
# originally only rnd_cfg was needed for the rsl_rl logger
# Right now it is matrching strcutrce for AlgorithmCfg - must be simplified
algorithm:
  class_name: null
  # Training
  learning_rate: null
  num_learning_epochs: null
  num_mini_batches: null
  schedule: null
  # Value function
  value_loss_coef: null
  clip_param: null
  use_clipped_value_loss: null
  # Surrogate loss
  desired_kl: null
  entropy_coef: null
  gamma: null
  lam: null
  max_grad_norm: null
  # Miscellaneous
  normalize_advantage_per_mini_batch: null
  # Random network distilation
  rnd_cfg: null
  # Symmetry augmentation
  symmetry_cfg: null
# network architecture
policy:
  # TODO(issue#120) load config from clearml-model-id (currently only from clearml-task-id)
  encoder_type: "shared_cnn"  # shared_cnn, per_camera_cnn, autoencoder
  fusion_type: "linear"  # linear, attention_vector, attention_spatial
  use_pose_head: True
  vision_encoder:
      conv_layers:
        0:
          in_channels: 3
          out_channels: 8
          kernel_size: 3
          stride: 1
          padding: 1
        1:
          in_channels: 8
          out_channels: 16
          kernel_size: 3
          stride: 2
          padding: 1
        2:
          in_channels: 16
          out_channels: 32
          kernel_size: 3
          stride: 2
          padding: 1
  vision_encoder_spatial:
    conv_layers:
      0:
        in_channels: 3
        out_channels: 8
        kernel_size: 3
        stride: 1
        padding: 1
      1:
        in_channels: 8
        out_channels: 16
        kernel_size: 3
        stride: 2
        padding: 1
      2:
        in_channels: 16
        out_channels: 32
        kernel_size: 3
        stride: 2
        padding: 1
      3:
        in_channels: 32
        out_channels: 64
        kernel_size: 3
        stride: 2
        padding: 1
  linear_fusion:
      fusion_output_dim: 512
      pool_size: 4
  attention_vector_fusion:
      fusion_output_dim: 512
      num_heads: 4
      pool_size: 4
  attention_spatial_fusion:
      fusion_output_dim: 256
      num_heads: 4
  # null: the sum of the `state_obs` dimensions; a number is checked against it
  action_head_state_obs_dim: 7
  # the non-image inputs: tcp_pose (7), reference_offset (2, admittance reference - TCP in XY),
  # contact_force (2, the tared F/T force in world XY x the env's force_obs_scale),
  # teacher_obs (the teacher's full observation, privileged: a sim-only sanity check)
  state_obs: ["tcp_pose"]
  action_head_hidden_dims: [128, 128, 64]
  pose_head_hidden_dims: [64, 64]
  # between the fused features (+ state_obs) and the action head; any type but "none" needs the
  # enc_mem_dec package (image geonosis:5000/aegis_gym_emd)
  memory:
    type: "none"  # none, identity (memoryless, trained on chunks), frame_stack, gru, lstm, attention_window
    residual: False  # the current step's features appended to the memory's output
    hidden_dim: 256  # gru, lstm
    num_layers: 1  # gru, lstm
    num_frames: 4  # frame_stack
    frame_stride: 1  # frame_stack: the steps between the stacked frames
    window: 16  # attention_window: the steps attended, the current one included
    model_dim: 128  # attention_window
    num_heads: 4  # attention_window
    # training chunks: `burn_in` steps without gradients, then the loss on `sequence_length`
    sequence_length: 32
    burn_in: 16
  # a decoder of the tee's planar pose (x, y in dm, sin / cos yaw) from the action head's input (the
  # memory's output, the features without a memory); its loss weight, 0: no decoder
  latent_pose_loss_weight: 0.0
  latent_pose_hidden_dims: [128]
# training settings
buffer_size: 1000
save_freq: 50
eval_freq: 50
best_model_skip_iters: 100  # Ignore first N iterations when tracking best model
reset_last_layer_weights_interval: 0  # Set above 0 to enable
reset_last_layer_weights_part: "both"  # `action`, `pose` or `all`
