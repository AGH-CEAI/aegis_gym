enabled: True
debug_viewer: True
image_aug:
    enabled: True
    per_episode_aug: True
    brightness_jitter: 0.4
    contrast_jitter: 0.3
    gaussian_noise_std: 0.025
    gamma_range: 0.25
    channel_jitter: 0.05
    blur_prob: 0.30
    blur_kernel_size: 3
    blur_sigma: 0.8
    cutout:
        prob: 0.3
        min_size: 4
        max_size: 12
pd_gains:
    enabled: True
    kp_noise: 0.10
    kv_noise: 0.10
max_speed:
    enabled: True
    linear_speed_noise: 0.03
    angular_speed_noise: 0.03
cameras_extrinsics:
    enabled: True
    scene_cam:
        translation_std: 0.0
        rotation_std_deg: 1.0
    tool_cams:
        translation_std: 0.001
        rotation_std_deg: 0.6
ft_sensor_noise:
    enabled: True
    # Raw sensor at rest with the admittance holding (A1), internal_filter_rate 0, sampled at the
    # policy rate (25 Hz). Fitted on ft_rest_10min.csv (MoveIt holding, 2026-11-04) and scaled by the
    # quiet-second ratios of ft_rest_10min_admittance.csv (2026-11-05, 26.4 C): force x1.6 / x1.7 /
    # x1.0, torque x1.8 / x1.8 / x1.0; the active loop adds noise in x/y only. Per axis [x, y, z];
    # limits are 3 sigma. `correlation`: lag-1 between consecutive steps, [fx, fy, fz, tx, ty, tz].
    force_std: [0.0246, 0.0201, 0.0139]
    force_limit: [0.074, 0.060, 0.042]
    torque_std: [0.0016, 0.00225, 0.00038]
    torque_limit: [0.0048, 0.0068, 0.0011]
    correlation: [0.2, 0.0, 0.0, 0.0, 0.2, 0.0]
ft_sensor_bias:
    enabled: True
    # Residual offset left by a real tare, resampled per episode, uniform in +-range.
    # 5 hardware tares before Enable (2026-11-05): |mean| <= 0.038 / 0.015 / 0.023 N, std across
    # tares 0.016 / 0.008 / 0.009 N. Torques not re-measured (driver leftovers |T|=0.006 Nm).
    force_range: [0.04, 0.02, 0.03]
    torque_range: [0.006, 0.003, 0.001]
ft_sensor_drift:
    enabled: True
    # Zero drift since the last tare, restarted at every tare and episode reset: a per-episode
    # rate uniform in +-range plus a random walk. Fitted on ft_rest_10min.csv (2026-11-04): rates
    # -1.9 / -1.6 / +6.1 mN/min (force), ~0 (torque); range ~2x that. The walk is the 10-30 s value
    # (it falls with longer spans: the drift is bounded rather than a pure random walk).
    # Room at a stable 27.1 +-0.1 C: a lower bound for a warming robot or room.
    force_rate_range: [6.0e-5, 6.0e-5, 2.0e-4]  # [N/s]
    torque_rate_range: [1.0e-6, 1.0e-6, 5.0e-7]  # [Nm/s]
    force_walk_std: [5.0e-4, 8.0e-4, 2.2e-3]  # [N/sqrt(s)]
    torque_walk_std: [4.0e-5, 3.0e-5, 1.0e-5]  # [Nm/sqrt(s)]
ft_sensor_impulses:
    enabled: False
    # Single-step kicks from ambient vibrations (talking, 3D printer, traffic): ~1.6 /s in x/y while
    # disturbed (46 % of ft_rest_10min_admittance.csv), ~0.04 /s otherwise; p50 0.2 N, p90 0.3-0.5 N,
    # max 1.4 N. Per sensor axis [x, y, z]: Poisson rate, uniform magnitude, random sign.
    rate: [1.0, 1.0, 0.3]  # [1/s]
    magnitude_range: [0.2, 0.5]  # [N]
