enabled: True
debug_viewer: True
image_aug:
    enabled: True
    per_episode_aug: True
    brightness_jitter: 0.4
    contrast_jitter: 0.3
    gaussian_noise_std: 0.025
    gamma_range: 0.25
    channel_jitter: 0.05
    blur_prob: 0.30
    blur_kernel_size: 3
    blur_sigma: 0.8
    cutout:
        prob: 0.3
        min_size: 4
        max_size: 12
pd_gains:
    enabled: True
    kp_noise: 0.10
    kv_noise: 0.10
max_speed:
    enabled: True
    linear_speed_noise: 0.03
    angular_speed_noise: 0.03
cameras_extrinsics:
    enabled: True
    scene_cam:
        translation_std: 0.0
        rotation_std_deg: 1.0
    tool_cams:
        translation_std: 0.001
        rotation_std_deg: 0.6
ft_sensor_noise:
    enabled: True
    # Raw sensor at rest, internal_filter_rate 0, 10 min (ft_rest_10min.csv, 2026-11-04), sampled at
    # the policy rate (25 Hz). Per axis [x, y, z]; limits are 3 sigma. `correlation`: lag-1 between
    # consecutive steps, [fx, fy, fz, tx, ty, tz] (fx/ty carry a slow structural component).
    force_std: [0.0154, 0.0118, 0.0139]
    force_limit: [0.046, 0.035, 0.042]
    torque_std: [0.00089, 0.00125, 0.00038]
    torque_limit: [0.0027, 0.0038, 0.0011]
    correlation: [0.47, 0.15, 0.0, 0.15, 0.42, 0.0]
ft_sensor_bias:
    enabled: True
    # Residual offset left by a real tare, resampled per episode, uniform in +-range.
    # Measured leftovers after the driver's zeroing were |F|=0.34 N, |T|=0.006 Nm.
    force_range: [0.10, 0.15, 0.35]
    torque_range: [0.006, 0.003, 0.001]
ft_sensor_drift:
    enabled: True
    # Zero drift since the last tare, restarted at every tare and episode reset: a per-episode
    # rate uniform in +-range plus a random walk. Fitted on ft_rest_10min.csv (2026-11-04): rates
    # -1.9 / -1.6 / +6.1 mN/min (force), ~0 (torque); range ~2x that. The walk is the 10-30 s value
    # (it falls with longer spans: the drift is bounded rather than a pure random walk).
    # Room at a stable 27.1 +-0.1 C: a lower bound for a warming robot or room.
    force_rate_range: [6.0e-5, 6.0e-5, 2.0e-4]  # [N/s]
    torque_rate_range: [1.0e-6, 1.0e-6, 5.0e-7]  # [Nm/s]
    force_walk_std: [5.0e-4, 8.0e-4, 2.2e-3]  # [N/sqrt(s)]
    torque_walk_std: [4.0e-5, 3.0e-5, 1.0e-5]  # [Nm/sqrt(s)]
