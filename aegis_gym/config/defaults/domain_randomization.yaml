enabled: True
debug_viewer: True
image_aug:
    enabled: True
    per_episode_aug: True
    brightness_jitter: 0.4
    contrast_jitter: 0.3
    gaussian_noise_std: 0.025
    gamma_range: 0.25
    channel_jitter: 0.05
    blur_prob: 0.30
    blur_kernel_size: 3
    blur_sigma: 0.8
    cutout:
        prob: 0.3
        min_size: 4
        max_size: 12
pd_gains:
    enabled: True
    kp_noise: 0.10
    kv_noise: 0.10
max_speed:
    enabled: True
    linear_speed_noise: 0.03
    angular_speed_noise: 0.03
cameras_extrinsics:
    enabled: True
    scene_cam:
        translation_std: 0.0
        rotation_std_deg: 1.0
    tool_cams:
        translation_std: 0.001
        rotation_std_deg: 0.6
ft_sensor_noise:
    enabled: True
    # Measured on the real sensor, 5 min at rest, ros2_net_ft_driver particle filter
    # at 8 (max). Per axis [x, y, z]; limits are 3 sigma.
    force_std: [0.0035, 0.0056, 0.0150]
    force_limit: [0.0105, 0.0168, 0.0449]
    torque_std: [0.00023, 0.00025, 0.00007]
    torque_limit: [0.00069, 0.00074, 0.00020]
ft_sensor_bias:
    enabled: True
    # Residual offset left by a real tare, resampled per episode, uniform in +-range.
    # Measured leftovers after the driver's zeroing were |F|=0.34 N, |T|=0.006 Nm.
    force_range: [0.10, 0.15, 0.35]
    torque_range: [0.006, 0.003, 0.001]
