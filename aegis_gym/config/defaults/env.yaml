# TODO(issue##152): Extract env specific config to dict and parse them inside the env classes
# === SHARED ===
env_name: "reacher"  # options: reacher, push_t
num_envs: 10
num_obs: 14
num_actions: 6
action_max_linear_speed: 0.098  # m/s
action_max_angular_speed: 0.1  # rad/s
episode_length_s: 5.0
max_steps: null
ctrl_dt: 0.004  # 1 / 250 Hz (RTDE protocol freq), original 0.01
policy_dt: 0.04  # 1 / 25 Hz, used to calculate number of steps
table_size: [0.55, 0.84, 0.818]
# TODO(issue#98): Move URDF-depended values to the CLearML dataset
workbench_size: [0.64, 1.0, 0.821]
image_resolution: [64, 64]
use_rasterizer: True
visualize_camera: False
visualize_cell: True
cameras_setup: "default"  # options: default, scene_dual

# === REACHER ===
box_size_default: [0.03, 0.08, 0.06]
box_size_symmetrical: [0.0283, 0.0283, 0.1005]
box_collision: False
box_fixed: True
box_spawnbox_xlength: 0.22
box_spawnbox_ylength: 0.4
box_spawnbox_xoffset: 0.36
box_spawnbox_yoffset: -0.2
reacher_reward_scales:
    keypoints: 1.0

# === PUSH-T ===
tee_spawnbox_xlength: 0.08
tee_spawnbox_ylength: 0.2
tee_spawnbox_xoffset: -0.04
tee_spawnbox_yoffset: -0.1
tee_goal_offset: [0.47, 0.0]
tee_goal_z_rot_deg: 0.0
tee_success_intersection_thresh: 0.90
tee_mask_resolution: 64
tee_mask_half_width: 0.15
tee_friction: 0.4
push_t_reward_scales:
    rotation_alignment: 1.0
    position_alignment: 1.0
    tcp_proximity: 1.0
    success_bonus: 3.0
