ee_link_name: "robotiq_hande_end"
gripper_link_names: ["robotiq_hande_left_finger", "robotiq_hande_right_finger"]
default_arm_dof: [0.0, -2.09, 2.09, -1.57, -1.57, 0.0]
default_gripper_dof: [0.025, 0.025]
ik_method: "dls_ikv"
fts_wrench_source: "contact"
urdf_id_cell: "c44c56e7671d4004b120b0341fb727a4"
urdf_id_cell_collision: "0424f220ddc54091ae3b56b29854532f"
urdf_id_no_cell: "718ea536c68c4aaba79d1515ced27eeb"

# Measured with `ft_sensor_identify_payload` on the real cell (two runs: 1.3604 /
# 1.3578 kg, COM repeatable to 0.1 mm). The URDF link sum is 1.2760 kg at z=65.7 mm,
# so it under-reads by 83 g and puts the COM 6.6 mm too far out.
# Re-measure after any change to the gripper, its cabling or the sensor adapter.
fts_payload_mass: 1.3591
fts_payload_com: [0.0007, 0.0003, 0.0591]

# Bounds how hard the simulated arm can push, standing in for the cell's force limit.
# 0.02 rad measures as a ~160 N ceiling at the tool; see RobotCfg for the full curve.
servo_follow_error_max_rad: 0.02

servo_stiffness_scale: 0.65
servo_command_delay_s: 1.20
