# Confirmation of the drop_sweep.yaml candidates on other seeds and a longer settle time, for
# scripts/peg_in_hole/drop_sweep.py: every config below is run once per seed (a separate process each).

run:
  scenario: random
  num_envs: 64        # per slot
  seed: [2, 3]
  settle: 5.0         # [s] longer than the sweep's 3 s: tells slow settling from contact chatter

configs:
  - {ctrl_dt: 0.004, rigid_contact: {}}  # Genesis defaults, the env today
  - {ctrl_dt: 0.004, rigid_contact: {box_box_detection: true, constraint_timeconst: 0.01, noslip_iterations: 0}}
  - {ctrl_dt: 0.004, rigid_contact: {box_box_detection: true, constraint_timeconst: 0.01, noslip_iterations: 5}}
  - {ctrl_dt: 0.004, rigid_contact: {box_box_detection: true, constraint_timeconst: 0.02, noslip_iterations: 0}}
  - {ctrl_dt: 0.002, rigid_contact: {box_box_detection: true, constraint_timeconst: 0.01, noslip_iterations: 5}}
  - {ctrl_dt: 0.002, rigid_contact: {box_box_detection: true, constraint_timeconst: 0.02, noslip_iterations: 0}}
