# Contact parameter sweep for scripts/peg_in_hole/drop_sweep.py: every combination of the `grid` values is one
# drop_test run (a separate process) with the `run` arguments. Keys under `rigid_contact` are Genesis RigidOptions
# overrides, as env.rigid_contact in the config.

run:
  scenario: random
  num_envs: 64        # per slot
  seed: 1
  settle: 3.0         # [s]

grid:
  ctrl_dt: [0.004, 0.002]                # [s] the env's control step today, and half of it
  rigid_contact:
    box_box_detection: [false, true]     # MuJoCo-style box-box contacts instead of the general GJK/MPR
    constraint_timeconst: [0.01, 0.02]   # [s] contact stiffness time constant (Genesis default 0.01)
    noslip_iterations: [0, 5]            # extra friction-only iterations against creep (Genesis default 0)
